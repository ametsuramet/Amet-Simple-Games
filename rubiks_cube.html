<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Rubik's Cube</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111827; /* Tailwind gray-900 */
            font-family: 'Inter', sans-serif;
        }
        #scene-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        /* Crucial to prevent browser scrolling when swiping on the cube */
        #scene-container canvas {
            touch-action: none;
            outline: none;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through to canvas */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1.5rem;
        }
        .pointer-events-auto {
            pointer-events: auto;
        }
        .glass-panel {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
    <!-- Import map for Three.js ES Modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body class="text-white">

    <!-- 3D Canvas Container -->
    <div id="scene-container"></div>
    <canvas id="fireworks-canvas" class="fixed inset-0 pointer-events-none z-40 hidden"></canvas>

    <!-- UI Overlay -->
    <div id="ui-layer">
        <div class="flex flex-col sm:flex-row justify-between items-start gap-3">
            <div class="glass-panel p-4 sm:p-5 rounded-2xl sm:rounded-3xl pointer-events-auto shadow-2xl max-w-xs">

                <p class="text-xs sm:text-sm text-gray-300 mt-1 sm:mt-2 ml-1 hidden xs:block">
                    • <b>Drag background</b> to orbit camera.<br>
                    • <b>Drag a cube face</b> to rotate that layer.
                </p>
            </div>

            <div class="flex items-center gap-2 pointer-events-auto self-end sm:self-start">
                <div id="stats-panel" class="glass-panel px-3 sm:px-4 py-2 sm:py-2.5 rounded-2xl shadow-2xl flex items-center gap-2.5 text-xs sm:text-sm font-bold">
                    <div class="flex items-center gap-1 text-sky-300">

                <a href="index.html" class="glass-panel px-3 sm:px-4 py-2 sm:py-2.5 rounded-2xl shadow-2xl flex items-center gap-1.5 hover:bg-gray-800 transition-colors active:scale-95 text-gray-200">
                    <span class="text-base sm:text-lg">🏠</span>

        <div class="flex justify-center gap-4 mb-4 md:mb-8 pointer-events-auto">
            <button id="btn-shuffle" class="glass-panel px-6 py-3 rounded-full font-semibold hover:bg-gray-800 transition-colors shadow-lg active:scale-95 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 256 256"><path d="M213.66,181.66l-24,24a8,8,0,0,1-11.32-11.32L192.69,180l-14.35-14.34a8,8,0,0,1,11.32-11.32l24,24A8,8,0,0,1,213.66,181.66ZM42.34,74.34l24-24a8,8,0,0,0-11.32-11.32L40.69,53.34,26.34,39A8,8,0,0,0,15,50.34l24,24A8,8,0,0,0,42.34,74.34ZM224,72a8,8,0,0,0-8-8H67.31L42.34,39A8,8,0,0,0,31,50.34L52.69,72H32a8,8,0,0,0,0,16H216A8,8,0,0,0,224,72ZM32,192H188.69l25-25a8,8,0,0,1,11.32,11.32l-21.66,21.66L188.69,225a8,8,0,0,1-11.32-11.32L198.69,198H40A8,8,0,0,1,40,182H32a8,8,0,0,1,0-16Z"></path></svg>
                Shuffle
            </button>
            <button id="btn-reset" class="glass-panel px-6 py-3 rounded-full font-semibold hover:bg-gray-800 transition-colors shadow-lg active:scale-95 flex items-center gap-2 text-red-400">

                Reset

    </div>

    <!-- Confirm Modal -->
    <div id="confirm-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-200">

    <!-- Win Modal -->
    <div id="win-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/75 backdrop-blur-md opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="glass-panel max-w-md w-full p-6 sm:p-8 rounded-3xl shadow-2xl border border-emerald-500/30 text-center transform scale-90 transition-transform duration-300 relative overflow-hidden" id="win-modal-box">
            <div class="text-6xl mb-3 animate-bounce">🏆</div>
            <h2 class="text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 to-cyan-400 mb-2">Selamat!</h2>
            <p class="text-sm text-gray-300 mb-6">Kamu berhasil menyelesaikan dan menyusun kembali Rubik's Cube!</p>
            
            <div class="grid grid-cols-2 gap-3 mb-6 bg-slate-900/60 p-4 rounded-2xl border border-white/5">
                <div class="flex flex-col items-center">
                    <span class="text-xs text-gray-400 uppercase font-semibold">Waktu</span>
                    <span id="win-time" class="text-xl font-extrabold text-sky-400 mt-1">00:00</span>
                </div>
                <div class="flex flex-col items-center">
                    <span class="text-xs text-gray-400 uppercase font-semibold">Gerakan</span>
                    <span id="win-moves" class="text-xl font-extrabold text-emerald-400 mt-1">0 gerakan</span>
                </div>
            </div>

            <div class="flex justify-center gap-3">
                <button id="btn-win-shuffle" class="px-6 py-2.5 rounded-full font-bold text-white shadow-lg bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-sm flex items-center gap-1.5 transition-colors">
                    🔀 Main Lagi
                </button>
                <button id="btn-win-close" class="px-5 py-2.5 rounded-full font-semibold bg-gray-800 hover:bg-gray-700 text-gray-300 transition-colors text-sm active:scale-95">
                    Tutup
                </button>
            </div>
        </div>
    </div>

    <!-- Main Game Logic -->
    <script type="module">
        import * as THREE from 'three';
        import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

        // --- Core Variables ---
        let scene, camera, renderer;
        let cubies = [];
        let isAnimating = false;
        let shuffleQueue = [];
        
        // Materials for the 6 faces (Right, Left, Top, Bottom, Front, Back)
        // Standard Rubik's color scheme
        const colors = [
            0xef4444, // R - Red (Tailwind red-500)
            0xf97316, // L - Orange (Tailwind orange-500)
            0xf8fafc, // U - White (Tailwind slate-50)
            0xffea00, // D - Yellow
            0x22c55e, // F - Green (Tailwind green-500)
            0x3b82f6  // B - Blue (Tailwind blue-500)
        ];
        
        // Inner plastic color
        const innerColor = 0x111111;
        const cubieSize = 0.95; // Slightly smaller than 1 for gaps
        
        // Menggunakan RoundedBoxGeometry agar tepian kubus 3D membulat
        const geometry = new RoundedBoxGeometry(cubieSize, cubieSize, cubieSize, 4, 0.08);

        // Interaction state
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        let activeCubie = null;
        let intersectNormal = null;
        let pointerDownPos = new THREE.Vector2();
        let pointerDragPos = new THREE.Vector2();
        const DRAG_THRESHOLD = 15;

        let isDraggingCamera = false;
        let prevPointerPos = new THREE.Vector2();
        let cameraVelocity = new THREE.Vector2();
        const activeTouches = new Map();
        let initialPinchDist = null;
        let initialCameraDist = null;

        let isGameActive = false;
        let isShuffling = false;
        let moveCount = 0;
        let timerSeconds = 0;
        let timerInterval = null;
        let confirmCallback = null;

        let fireworksActive = false;
        let fireworksParticles = [];
        let fireworksCanvas = null;
        let fireworksCtx = null;

        init();
        animate();

        function init() {
            // 1. Setup Scene, Camera, Renderer
            const container = document.getElementById('scene-container');
            scene = new THREE.Scene();
            
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(4.5, 4.5, 6);
            camera.lookAt(0, 0, 0);
            camera.up.copy(new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion));

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // 2. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight1.position.set(10, 20, 10);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
            dirLight2.position.set(-10, -20, -10);
            scene.add(dirLight2);

            // 4. Create Puzzle
            createPuzzle();

            // 5. Event Listeners
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('wheel', onWheel, { passive: true });
            
            // Pointer events for interaction (handles both mouse and touch)
            renderer.domElement.addEventListener('pointerdown', onPointerDown);
            window.addEventListener('pointermove', onPointerMove);
            window.addEventListener('pointerup', onPointerUp);
            window.addEventListener('pointercancel', onPointerUp);

            document.getElementById('btn-shuffle').addEventListener('click', () => {
                if (isAnimating || isShuffling) return;
                showConfirmModal({
                    icon: '🔀',
                    title: 'Acak Kubus?',
                    message: 'Permainan baru akan dimulai dengan susunan teracak. Waktu dan gerakan akan dihitung.',
                    okText: 'Acak Sekarang',
                    okClass: 'bg-blue-600 hover:bg-blue-500',
                    onConfirm: () => startShuffleGame()
                });
            });

            document.getElementById('btn-reset').addEventListener('click', () => {
                showConfirmModal({
                    icon: '🔄',
                    title: 'Reset Kubus?',
                    message: 'Kembalikan posisi semua warna kubus ke keadaan awal tersusun rapi?',
                    okText: 'Reset',
                    okClass: 'bg-red-600 hover:bg-red-500',
                    onConfirm: () => resetCube()
                });
            });

            document.getElementById('btn-confirm-cancel').addEventListener('click', hideConfirmModal);
            document.getElementById('btn-confirm-ok').addEventListener('click', () => {
                if (confirmCallback) confirmCallback();
                hideConfirmModal();
            });
            document.getElementById('confirm-modal').addEventListener('click', (e) => {
                if (e.target === document.getElementById('confirm-modal')) hideConfirmModal();
            });

            document.getElementById('btn-win-close').addEventListener('click', hideWinModal);
            document.getElementById('btn-win-shuffle').addEventListener('click', () => {
                hideWinModal();
                startShuffleGame();
            });
            document.getElementById('win-modal').addEventListener('click', (e) => {
                if (e.target === document.getElementById('win-modal')) hideWinModal();
            });

            initFireworks();
        }

        function createPuzzle() {
            // Clear existing
            cubies.forEach(c => {
                c.geometry.dispose();
                scene.remove(c);
            });
            cubies = [];

            // Build 3x3x3 grid
            for (let x = -1; x <= 1; x++) {
                for (let y = -1; y <= 1; y++) {
                    for (let z = -1; z <= 1; z++) {
                        createCubie(x, y, z);
                    }
                }
            }
        }

        function createCubie(x, y, z) {
            // Determine material for each of the 6 faces. 
            // If the face is on the exterior, give it a color, otherwise inner plastic.
            const materials = [
                new THREE.MeshStandardMaterial({ color: x === 1 ? colors[0] : innerColor, roughness: 0.1, metalness: 0.1 }),
                new THREE.MeshStandardMaterial({ color: x === -1 ? colors[1] : innerColor, roughness: 0.1, metalness: 0.1 }),
                new THREE.MeshStandardMaterial({ color: y === 1 ? colors[2] : innerColor, roughness: 0.1, metalness: 0.1 }),
                new THREE.MeshStandardMaterial({ color: y === -1 ? colors[3] : innerColor, roughness: 0.1, metalness: 0.1 }),
                new THREE.MeshStandardMaterial({ color: z === 1 ? colors[4] : innerColor, roughness: 0.1, metalness: 0.1 }),
                new THREE.MeshStandardMaterial({ color: z === -1 ? colors[5] : innerColor, roughness: 0.1, metalness: 0.1 })
            ];

            const mesh = new THREE.Mesh(geometry, materials);
            mesh.position.set(x, y, z);
            mesh.userData = { isCubie: true };
            scene.add(mesh);
            cubies.push(mesh);
        }

        // --- Interaction Logic ---

        function onPointerDown(e) {
            if (isAnimating || isShuffling) return;

            activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (activeTouches.size === 2) {
                isDraggingCamera = false;
                activeCubie = null;
                const pts = Array.from(activeTouches.values());
                initialPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                initialCameraDist = camera.position.length();
                return;
            }
            
            pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
            pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(pointer, camera);
            const intersects = raycaster.intersectObjects(cubies);

            if (intersects.length > 0) {
                isDraggingCamera = false;
                cameraVelocity.set(0, 0);
                activeCubie = intersects[0].object;
                
                intersectNormal = intersects[0].face.normal.clone();
                const normalMatrix = new THREE.Matrix3().getNormalMatrix(activeCubie.matrixWorld);
                intersectNormal.applyMatrix3(normalMatrix).round();

                pointerDownPos.set(e.clientX, e.clientY);
            } else {
                activeCubie = null;
                isDraggingCamera = true;
                prevPointerPos.set(e.clientX, e.clientY);
                cameraVelocity.set(0, 0);
            }
        }

        function onPointerMove(e) {
            if (activeTouches.has(e.pointerId)) {
                activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });
            }
            if (activeTouches.size === 2 && initialPinchDist) {
                const pts = Array.from(activeTouches.values());
                const currentDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                const scale = initialPinchDist / Math.max(currentDist, 1);
                const newDist = Math.max(4, Math.min(15, initialCameraDist * scale));
                camera.position.setLength(newDist);
                return;
            }

            if (isDraggingCamera) {
                const dx = e.clientX - prevPointerPos.x;
                const dy = e.clientY - prevPointerPos.y;
                prevPointerPos.set(e.clientX, e.clientY);
                rotateCamera(dx, dy);
                cameraVelocity.set(dx, dy);
                return;
            }

            if (!activeCubie || isAnimating) return;
            
            pointerDragPos.set(e.clientX, e.clientY);
            
            const dx = pointerDragPos.x - pointerDownPos.x;
            const dy = pointerDragPos.y - pointerDownPos.y;
            
            if (Math.abs(dx) > DRAG_THRESHOLD || Math.abs(dy) > DRAG_THRESHOLD) {
                determineMoveAndExecute(dx, dy);
                activeCubie = null;
            }
        }

        function onPointerUp(e) {
            if (e && e.pointerId !== undefined) {
                activeTouches.delete(e.pointerId);
            }
            if (activeTouches.size < 2) {
                initialPinchDist = null;
            }
            isDraggingCamera = false;
            activeCubie = null;
        }

        function onWheel(e) {
            const factor = e.deltaY > 0 ? 1.08 : 0.92;
            const dist = camera.position.length();
            const newDist = Math.max(4, Math.min(15, dist * factor));
            camera.position.setLength(newDist);
        }

        function rotateCamera(dx, dy) {
            const speed = 0.006;
            const angleX = -dx * speed;
            const angleY = -dy * speed;

            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            const up = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);

            camera.position.applyAxisAngle(up, angleX);
            camera.up.applyAxisAngle(up, angleX);

            camera.position.applyAxisAngle(right, angleY);
            camera.up.applyAxisAngle(right, angleY);

            camera.lookAt(0, 0, 0);
        }

        function determineMoveAndExecute(dx, dy) {
            const axes = [
                { name: 'x', vec: new THREE.Vector3(1, 0, 0) },
                { name: 'y', vec: new THREE.Vector3(0, 1, 0) },
                { name: 'z', vec: new THREE.Vector3(0, 0, 1) }
            ];

            let bestAxis = null;
            let maxDot = -1;
            let direction = 1;

            // Screen drag vector in projected space conceptually aligns with (dx, -dy)
            const dragScreen = new THREE.Vector2(dx, -dy).normalize();

            // Evaluate valid rotation axes (must be perpendicular to clicked face normal)
            axes.forEach(axis => {
                // If dot product is near 0, the axis is perpendicular to the normal
                if (Math.abs(axis.vec.dot(intersectNormal)) < 0.1) {
                    
                    // The cross product of Normal and Axis tells us the direction 
                    // the surface would move in 3D space during a positive rotation.
                    const moveDirWorld = new THREE.Vector3().crossVectors(intersectNormal, axis.vec);
                    
                    // Project this 3D movement direction onto 2D screen space
                    const p1 = activeCubie.position.clone().project(camera);
                    const p2 = activeCubie.position.clone().add(moveDirWorld).project(camera);
                    const moveDirScreen = new THREE.Vector2(p2.x - p1.x, p2.y - p1.y).normalize();

                    // Compare how closely the user's swipe matches this expected movement
                    const dot = dragScreen.dot(moveDirScreen);

                    if (Math.abs(dot) > maxDot) {
                        maxDot = Math.abs(dot);
                        bestAxis = axis.name;
                        // Membalikkan arah drag secara absolut (-Math.sign) agar gerakan layer searah dengan tarikan jari/mouse
                        direction = -Math.sign(dot); 
                    }
                }
            });

            if (bestAxis) {
                const layer = Math.round(activeCubie.position[bestAxis]);
                if (isGameActive && !isShuffling) {
                    moveCount++;
                    updateMovesDisplay();
                }
                rotateLayer(bestAxis, layer, direction, 300, () => {
                    if (isGameActive && !isShuffling && isCubeSolved()) {
                        onGameWon();
                    }
                });
            }
        }

        // --- Rotation Engine ---

        function rotateLayer(axisName, layer, direction, duration, callback = null) {
            isAnimating = true;

            // Create a temporary pivot at the origin
            const pivot = new THREE.Object3D();
            scene.add(pivot);

            // Find all cubies belonging to this layer
            const activeCubes = [];
            cubies.forEach(c => {
                if (Math.abs(Math.round(c.position[axisName]) - layer) < 0.1) {
                    activeCubes.push(c);
                }
            });

            // Attach them to the pivot (Three.js maintains their world transform)
            activeCubes.forEach(c => pivot.attach(c));

            const targetAngle = direction * Math.PI / 2;
            let startAngle = 0;
            let startTime = null;

            // Animation loop for this move
            function animateRotation(time) {
                if (!startTime) startTime = time;
                const elapsed = time - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // Sine easing in-out
                const easeProgress = -(Math.cos(Math.PI * progress) - 1) / 2;

                pivot.rotation[axisName] = startAngle + (targetAngle - startAngle) * easeProgress;

                if (progress < 1) {
                    requestAnimationFrame(animateRotation);
                } else {
                    // Animation complete
                    pivot.updateMatrixWorld();
                    
                    activeCubes.forEach(c => {
                        // Reattach to main scene
                        scene.attach(c);
                        
                        // SNAP MATRIX: Fix floating point drift by rounding world matrix elements!
                        // A 90-degree axis-aligned rotation matrix only contains 0, 1, -1.
                        // Position vectors only contain integers.
                        c.updateMatrixWorld();
                        const elements = c.matrixWorld.elements;
                        for (let i = 0; i < 16; i++) {
                            elements[i] = Math.round(elements[i]);
                        }
                        c.matrix.fromArray(elements);
                        // Decompose back into pos/rot/scale for renderer
                        c.matrix.decompose(c.position, c.quaternion, c.scale);
                    });
                    
                    scene.remove(pivot);
                    isAnimating = false;

                    if (callback) callback();
                    else processQueue(); // Process next in shuffle if any
                }
            }
            
            requestAnimationFrame(animateRotation);
        }

        function startShuffleGame() {
            if (isAnimating || isShuffling) return;
            stopTimer();
            isGameActive = false;
            isShuffling = true;
            moveCount = 0;
            timerSeconds = 0;
            updateMovesDisplay();
            updateTimerDisplay();
            shuffleCube();
        }

        function shuffleCube() {
            if (isAnimating) return;
            const axes = ['x', 'y', 'z'];
            const layers = [-1, 0, 1];
            const dirs = [1, -1];
            
            for (let i = 0; i < 20; i++) {
                shuffleQueue.push({
                    axis: axes[Math.floor(Math.random() * 3)],
                    layer: layers[Math.floor(Math.random() * 3)],
                    dir: dirs[Math.floor(Math.random() * 2)]
                });
            }
            processQueue();
        }

        function processQueue() {
            if (shuffleQueue.length === 0) {
                if (isShuffling) {
                    isShuffling = false;
                    isGameActive = true;
                    moveCount = 0;
                    updateMovesDisplay();
                    startTimer();
                }
                return;
            }
            const move = shuffleQueue.shift();
            rotateLayer(move.axis, move.layer, move.dir, 120); 
        }

        function resetCube() {
            stopTimer();
            isGameActive = false;
            isShuffling = false;
            shuffleQueue = [];
            isAnimating = false;
            moveCount = 0;
            timerSeconds = 0;
            updateMovesDisplay();
            updateTimerDisplay();
            createPuzzle();
            camera.position.set(4.5, 4.5, 6);
            camera.up.set(0, 1, 0);
            camera.lookAt(0, 0, 0);
            camera.up.copy(new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion));
            cameraVelocity.set(0, 0);
            isDraggingCamera = false;
            activeCubie = null;
        }

        function startTimer() {
            stopTimer();
            timerSeconds = 0;
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                timerSeconds++;
                updateTimerDisplay();
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timerSeconds / 60);
            const secs = timerSeconds % 60;
            const formatted = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            const el = document.getElementById('timer-display');
            if (el) el.textContent = formatted;
            return formatted;
        }

        function updateMovesDisplay() {
            const el = document.getElementById('moves-display');
            if (el) el.textContent = `${moveCount} gerakan`;
        }

        function showConfirmModal({ icon, title, message, okText, okClass, onConfirm }) {
            const modal = document.getElementById('confirm-modal');
            const box = document.getElementById('confirm-modal-box');
            document.getElementById('confirm-icon').textContent = icon || '❓';
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-message').textContent = message;

            const okBtn = document.getElementById('btn-confirm-ok');
            okBtn.textContent = okText || 'Ya';
            okBtn.className = `px-5 py-2.5 rounded-full font-semibold transition-colors text-sm text-white shadow-lg active:scale-95 ${okClass || 'bg-blue-600 hover:bg-blue-500'}`;

            confirmCallback = onConfirm;

            modal.classList.remove('opacity-0', 'pointer-events-none');
            box.classList.remove('scale-95');
            box.classList.add('scale-100');
        }

        function hideConfirmModal() {
            const modal = document.getElementById('confirm-modal');
            const box = document.getElementById('confirm-modal-box');
            modal.classList.add('opacity-0', 'pointer-events-none');
            box.classList.add('scale-95');
            box.classList.remove('scale-100');
            confirmCallback = null;
        }

        function showWinModal() {
            const modal = document.getElementById('win-modal');
            const box = document.getElementById('win-modal-box');
            document.getElementById('win-time').textContent = updateTimerDisplay();
            document.getElementById('win-moves').textContent = `${moveCount} gerakan`;

            modal.classList.remove('opacity-0', 'pointer-events-none');
            box.classList.remove('scale-90');
            box.classList.add('scale-100');

            startFireworks();
        }

        function hideWinModal() {
            const modal = document.getElementById('win-modal');
            const box = document.getElementById('win-modal-box');
            modal.classList.add('opacity-0', 'pointer-events-none');
            box.classList.add('scale-90');
            box.classList.remove('scale-100');
            stopFireworks();
        }

        function onGameWon() {
            stopTimer();
            isGameActive = false;
            showWinModal();
        }

        function isCubeSolved() {
            const localNormals = [
                new THREE.Vector3(1, 0, 0),
                new THREE.Vector3(-1, 0, 0),
                new THREE.Vector3(0, 1, 0),
                new THREE.Vector3(0, -1, 0),
                new THREE.Vector3(0, 0, 1),
                new THREE.Vector3(0, 0, -1)
            ];

            const worldFaces = [
                { axis: 'x', val: 1, normal: new THREE.Vector3(1, 0, 0) },
                { axis: 'x', val: -1, normal: new THREE.Vector3(-1, 0, 0) },
                { axis: 'y', val: 1, normal: new THREE.Vector3(0, 1, 0) },
                { axis: 'y', val: -1, normal: new THREE.Vector3(0, -1, 0) },
                { axis: 'z', val: 1, normal: new THREE.Vector3(0, 0, 1) },
                { axis: 'z', val: -1, normal: new THREE.Vector3(0, 0, -1) }
            ];

            for (const face of worldFaces) {
                let faceColor = null;
                let count = 0;
                for (const c of cubies) {
                    if (Math.round(c.position[face.axis]) === face.val) {
                        count++;
                        let matchedColor = null;
                        for (let i = 0; i < 6; i++) {
                            const worldNorm = localNormals[i].clone().applyQuaternion(c.quaternion).round();
                            if (worldNorm.distanceToSquared(face.normal) < 0.1) {
                                matchedColor = c.material[i].color.getHex();
                                break;
                            }
                        }
                        if (matchedColor === null || matchedColor === innerColor) return false;
                        if (faceColor === null) {
                            faceColor = matchedColor;
                        } else if (faceColor !== matchedColor) {
                            return false;
                        }
                    }
                }
                if (count !== 9) return false;
            }
            return true;
        }

        function initFireworks() {
            fireworksCanvas = document.getElementById('fireworks-canvas');
            if (!fireworksCanvas) return;
            fireworksCtx = fireworksCanvas.getContext('2d');
            resizeFireworks();
        }

        function resizeFireworks() {
            if (!fireworksCanvas) return;
            fireworksCanvas.width = window.innerWidth;
            fireworksCanvas.height = window.innerHeight;
        }

        function startFireworks() {
            if (!fireworksCanvas) initFireworks();
            if (!fireworksCanvas) return;
            fireworksCanvas.classList.remove('hidden');
            fireworksActive = true;
            fireworksParticles = [];

            let bursts = 0;
            const maxBursts = 14;

            function launch() {
                if (!fireworksActive || bursts >= maxBursts) return;
                const x = window.innerWidth * (0.15 + Math.random() * 0.7);
                const y = window.innerHeight * (0.15 + Math.random() * 0.45);
                createExplosion(x, y);
                bursts++;
                if (bursts < maxBursts) {
                    setTimeout(launch, 250 + Math.random() * 300);
                }
            }

            launch();
            launch();
            requestAnimationFrame(updateFireworks);
        }

        function stopFireworks() {
            fireworksActive = false;
            fireworksParticles = [];
            if (fireworksCanvas) {
                fireworksCanvas.classList.add('hidden');
                if (fireworksCtx) fireworksCtx.clearRect(0, 0, fireworksCanvas.width, fireworksCanvas.height);
            }
        }

        function createExplosion(x, y) {
            const palette = ['#ef4444', '#f97316', '#ffea00', '#22c55e', '#3b82f6', '#ec4899', '#38bdf8', '#a855f7', '#ffffff'];
            const count = 45 + Math.floor(Math.random() * 30);
            const color = palette[Math.floor(Math.random() * palette.length)];

            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 6;
                fireworksParticles.push({
                    x,
                    y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    color: Math.random() > 0.25 ? color : '#ffffff',
                    size: 2.5 + Math.random() * 2.5,
                    alpha: 1,
                    decay: 0.012 + Math.random() * 0.014,
                    gravity: 0.08
                });
            }
        }

        function updateFireworks() {
            if (!fireworksActive && fireworksParticles.length === 0) return;

            fireworksCtx.clearRect(0, 0, fireworksCanvas.width, fireworksCanvas.height);

            for (let i = fireworksParticles.length - 1; i >= 0; i--) {
                const p = fireworksParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.gravity;
                p.vx *= 0.98;
                p.alpha -= p.decay;

                if (p.alpha <= 0) {
                    fireworksParticles.splice(i, 1);
                    continue;
                }

                fireworksCtx.save();
                fireworksCtx.globalAlpha = p.alpha;
                fireworksCtx.fillStyle = p.color;
                fireworksCtx.beginPath();
                fireworksCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                fireworksCtx.fill();
                fireworksCtx.restore();
            }

            if (fireworksActive || fireworksParticles.length > 0) {
                requestAnimationFrame(updateFireworks);
            } else {
                stopFireworks();
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            resizeFireworks();
        }

        function animate() {
            requestAnimationFrame(animate);
            if (!isDraggingCamera && cameraVelocity.lengthSq() > 0.0001) {
                rotateCamera(cameraVelocity.x, cameraVelocity.y);
                cameraVelocity.multiplyScalar(0.92);
            } else if (!isDraggingCamera) {
                cameraVelocity.set(0, 0);
            }
            renderer.render(scene, camera);
        }

    </script>
</body>
